name: Trigger Airflow DAG for Contract Provisioning

on:
  pull_request:
    paths:
      - 'contracts/current/**'
      - '.github/workflows/trigger-airflow-dag.yml'
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      process_all:
        description: 'Process all contracts instead of just changed ones'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  pull-requests: write
  contents: read
  checks: write

env:
  AIRFLOW_DAG_ID: contract_provisioning
  AIRFLOW_TIMEOUT: 600  # 10 minutes

jobs:
  trigger-airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed contract files
        id: changed-files
        run: |
          # Get the merge base to compare against
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)

          # Find all changed JSON files in contracts/current folder
          CHANGED_FILES=$(git diff --name-only $MERGE_BASE HEAD -- 'contracts/current/**/*.json' | tr '\n' ' ')
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed contract files: $CHANGED_FILES"

      - name: Check if contracts changed
        id: check-contracts
        run: |
          PROCESS_ALL="${{ github.event.inputs.process_all }}"
          CHANGED_FILES="${{ steps.changed-files.outputs.files }}"

          # If process_all flag is set (manual trigger), always proceed
          if [ "$PROCESS_ALL" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📋 process_all=true, will process all contracts"
          # If changed files exist, proceed
          elif [ -n "$CHANGED_FILES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📋 Found changed contracts, will trigger Airflow DAG"
          # Otherwise skip
          else
            echo "::notice::No contract files changed and process_all not set, skipping DAG trigger"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Airflow DAG
        if: steps.check-contracts.outputs.has_changes == 'true'
        id: trigger-dag
        run: |
          set -e

          AIRFLOW_URL="${{ secrets.AIRFLOW_URL }}"
          AIRFLOW_USERNAME="${{ secrets.AIRFLOW_USERNAME }}"
          AIRFLOW_PASSWORD="${{ secrets.AIRFLOW_PASSWORD }}"

          if [ -z "$AIRFLOW_URL" ]; then
            echo "::error::AIRFLOW_URL secret not configured"
            exit 1
          fi

          echo "🚀 Triggering Airflow DAG at $AIRFLOW_URL"

          # Determine process_all flag (true if workflow_dispatch with process_all=true, false otherwise)
          PROCESS_ALL="${{ github.event.inputs.process_all }}"
          if [ -z "$PROCESS_ALL" ]; then
            PROCESS_ALL="false"
          fi

          # Trigger DAG with GitHub context (using API v1 for Airflow 2.11)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$AIRFLOW_URL/api/v1/dags/${{ env.AIRFLOW_DAG_ID }}/dagRuns" \
            -H "Content-Type: application/json" \
            -u "$AIRFLOW_USERNAME:$AIRFLOW_PASSWORD" \
            -d @- << EOF
          {
            "conf": {
              "github_pr_number": ${{ github.event.pull_request.number }},
              "github_repo": "${{ github.repository }}",
              "github_token": "${{ secrets.GITHUB_TOKEN }}",
              "changed_files": "${{ steps.changed-files.outputs.files }}",
              "process_all": "$PROCESS_ALL"
            }
          }
          EOF
          )

          # Extract HTTP status code (last line)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          # Check if request succeeded (status 200)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to trigger DAG (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE_BODY"
            exit 1
          fi

          # Extract DAG run ID using Python for reliable JSON parsing
          DAG_RUN_ID=$(echo "$RESPONSE_BODY" | python3 -c "import sys, json; print(json.load(sys.stdin).get('dag_run_id', ''))" 2>/dev/null || echo "")

          if [ -z "$DAG_RUN_ID" ]; then
            echo "::error::Failed to extract DAG run ID from response"
            echo "Response: $RESPONSE_BODY"
            exit 1
          fi

          echo "dag_run_id=$DAG_RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ DAG triggered successfully (Run ID: $DAG_RUN_ID)"

      - name: Wait for Airflow DAG completion
        if: steps.check-contracts.outputs.has_changes == 'true'
        id: wait-dag
        run: |
          set -e

          AIRFLOW_URL="${{ secrets.AIRFLOW_URL }}"
          AIRFLOW_USERNAME="${{ secrets.AIRFLOW_USERNAME }}"
          AIRFLOW_PASSWORD="${{ secrets.AIRFLOW_PASSWORD }}"
          DAG_RUN_ID="${{ steps.trigger-dag.outputs.dag_run_id }}"

          echo "⏳ Waiting for DAG run $DAG_RUN_ID to complete (timeout: ${{ env.AIRFLOW_TIMEOUT }}s)"

          START_TIME=$(date +%s)
          POLL_INTERVAL=5
          SUCCESS=false

          while true; do
            ELAPSED=$(($(date +%s) - START_TIME))

            if [ $ELAPSED -gt ${{ env.AIRFLOW_TIMEOUT }} ]; then
              echo "::error::DAG execution timed out after $ELAPSED seconds"
              exit 1
            fi

            # Get DAG run status (using API v1 for Airflow 2.11)
            STATUS_RESPONSE=$(curl -s -X GET \
              "$AIRFLOW_URL/api/v1/dags/${{ env.AIRFLOW_DAG_ID }}/dagRuns/$DAG_RUN_ID" \
              -u "$AIRFLOW_USERNAME:$AIRFLOW_PASSWORD")

            STATE=$(echo "$STATUS_RESPONSE" | python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('state', ''))" 2>/dev/null || echo "")

            if [ -z "$STATE" ]; then
              echo "::error::Failed to get DAG run status"
              echo "Response: $STATUS_RESPONSE"
              exit 1
            fi

            echo "DAG state: $STATE (elapsed: ${ELAPSED}s)"

            case "$STATE" in
              success)
                echo "✅ DAG completed successfully"
                echo "state=success" >> $GITHUB_OUTPUT
                SUCCESS=true
                break
                ;;
              failed)
                echo "::error::DAG execution failed"
                echo "state=failed" >> $GITHUB_OUTPUT
                exit 1
                ;;
              upstream_failed)
                echo "::error::DAG execution failed (upstream task failed)"
                echo "state=upstream_failed" >> $GITHUB_OUTPUT
                exit 1
                ;;
              skipped)
                echo "::notice::DAG was skipped"
                echo "state=skipped" >> $GITHUB_OUTPUT
                SUCCESS=true
                break
                ;;
              running)
                echo "Still running... (${ELAPSED}s elapsed)"
                sleep $POLL_INTERVAL
                ;;
              *)
                echo "Unknown state: $STATE"
                sleep $POLL_INTERVAL
                ;;
            esac
          done

          if [ "$SUCCESS" = false ]; then
            exit 1
          fi

      - name: Fetch DAG results from Airflow
        if: steps.check-contracts.outputs.has_changes == 'true'
        id: fetch-results
        run: |
          set -e

          AIRFLOW_URL="${{ secrets.AIRFLOW_URL }}"
          AIRFLOW_USERNAME="${{ secrets.AIRFLOW_USERNAME }}"
          AIRFLOW_PASSWORD="${{ secrets.AIRFLOW_PASSWORD }}"
          DAG_RUN_ID="${{ steps.trigger-dag.outputs.dag_run_id }}"

          echo "📊 Fetching DAG execution results"

          # Fetch the collect_and_format_results task result (contains comment body)
          # Using API v1 for Airflow 2.11
          XCOM_RESPONSE=$(curl -s -X GET \
            "$AIRFLOW_URL/api/v1/dags/${{ env.AIRFLOW_DAG_ID }}/dagRuns/$DAG_RUN_ID/taskInstances/collect_and_format_results/xcomEntries?key=github_payload" \
            -u "$AIRFLOW_USERNAME:$AIRFLOW_PASSWORD")

          echo "XCom Response: $XCOM_RESPONSE"

          # Extract comment body using Python JSON parsing
          COMMENT_BODY=$(echo "$XCOM_RESPONSE" | python3 -c "import sys, json; data = json.load(sys.stdin); value = data[0].get('value', {}) if isinstance(data, list) and len(data) > 0 else {}; print(value.get('body', '') if isinstance(value, dict) else str(value) if value else '')" 2>/dev/null || echo "")

          if [ -z "$COMMENT_BODY" ]; then
            echo "::warning::Could not extract comment body from XCom, using fallback message"
            COMMENT_BODY="✅ Contract provisioning DAG completed successfully. Check Airflow UI for detailed results."
          fi

          # Save to file for next step (handle multiline)
          echo "$COMMENT_BODY" > /tmp/comment_body.txt
          echo "comment_body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/comment_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Save DAG run URL for later use
          DAG_RUN_URL="$AIRFLOW_URL/dags/${{ env.AIRFLOW_DAG_ID }}/runs/$DAG_RUN_ID"
          echo "dag_run_url=$DAG_RUN_URL" >> $GITHUB_OUTPUT

          echo "✅ Results fetched successfully"

      - name: Comment on PR with results
        if: steps.check-contracts.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.fetch-results.outputs.comment_body }}
          DAG_RUN_URL: ${{ steps.fetch-results.outputs.dag_run_url }}
          DAG_RUN_ID: ${{ steps.trigger-dag.outputs.dag_run_id }}
        with:
          script: |
            const commentBody = process.env.COMMENT_BODY || '';
            const dagRunUrl = process.env.DAG_RUN_URL || '';
            const dagRunId = process.env.DAG_RUN_ID || '';

            let finalComment;
            if (!commentBody.trim()) {
              core.warning('Comment body is empty, using minimal message');
              finalComment = `## ✅ Contract Provisioning Completed\n\n**DAG Run ID:** \`${dagRunId}\`\n\n**View Details:**\n- [📊 Airflow DAG Run](${dagRunUrl})\n\n---\n*Contract provisioning completed successfully. Check the Airflow UI for detailed logs and execution results.*`;
            } else {
              finalComment = `## ✅ Contract Provisioning Results\n\n${commentBody}\n\n---\n**Additional Information:**\n- **DAG Run ID:** \`${dagRunId}\`\n- **View Full Details:** [📊 Airflow DAG Run](${dagRunUrl})`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: finalComment
            });

            console.log('✅ Comment posted on PR #' + context.issue.number);

      - name: Set PR status check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.wait-dag.outputs.state }}' === 'success' ? 'success' : 'failure';
            const description = '${{ steps.wait-dag.outputs.state }}' === 'success'
              ? 'Contract provisioning completed successfully'
              : 'Contract provisioning failed - check Airflow logs';

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Contract Provisioning',
              head_sha: context.sha,
              status: 'completed',
              conclusion: state,
              output: {
                title: 'Contract Provisioning via Airflow',
                summary: description,
                text: 'View detailed logs in Airflow UI: ${{ secrets.AIRFLOW_URL }}/dags/${{ env.AIRFLOW_DAG_ID }}/runs'
              }
            });
